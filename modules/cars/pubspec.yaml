name: cars
description: "Cars module for the Winarch application."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.6.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  easy_localization: ^3.0.7
  wincore:
    path: ../../packages/wincore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/translations/

